[sdl]
fullscreen=false
output=surface
[dosbox]
machine=svga_s3
memsize=16
captures=captures
[cpu]
core=normal
cputype=auto
cycles=12000
[mixer]
nosound=false
rate=22050
blocksize=1024
prebuffer=30
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=auto
oplemu=default
oplrate=22050
[midi]
mpu401=none
mididevice=none
[autoexec]
mount c .
c:
audio.com
exit
